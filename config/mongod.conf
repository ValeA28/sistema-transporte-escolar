# Configuración común de los tres nodos del replica set rs0.
# El puerto y la carpeta de datos de cada nodo se indican al iniciarlo.
# Las rutas son relativas: los comandos se ejecutan desde la raíz del repositorio.

net:
  bindIp: 127.0.0.1

replication:
  replSetName: rs0

security:
  # Autorización obligatoria: toda conexión debe autenticarse.
  authorization: enabled
  # Clave compartida para que los nodos se autentiquen entre sí.
  # Este archivo NO se sube al repositorio (ver .gitignore).
  keyFile: config/keyfile